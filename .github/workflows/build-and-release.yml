name: Build and Release Fabric Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon
        
      - name: Extract Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Villager Reroll Fabric ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Villager Reroll Mod v1.1.0
            - Loader: Fabric 1.21.1
            - Botão de Reroll na interface do Villager
            - Mantém profissão e nível intactos
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
